services:
    pgis: 
        build:
            context: .
            dockerfile: ./db/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        ports: 
            - "4321:5432"
        volumes: 
            - postgis_data:/var/lib/postgresql
            - ./scr:/scr:ro
            - ./db/initdb:/docker-entrypoint-initdb.d:ro
            - ./db/dump:/dump
            - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]
        healthcheck:
            test: ["CMD", "pg_isready", "-h", "localhost", "-U", "gis"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
    api:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        depends_on:
            pgis:
                condition: service_healthy
        env_file:
            - .env
        ports:
            - "9999:9999"
        volumes: 
            - ./data/persist.json:/app/data/persist.json
            - ./data/cycle_osm.geojson:/app/data/cycle_osm.geojson
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9999/health"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
    
    proxy:
        build: 
            context: .
            dockerfile: ./nginx/Dockerfile
        restart: unless-stopped
        depends_on:
            pgis:
                condition: service_healthy
            api:
                condition: service_healthy
        ports: 
            - "3333:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./www/index.html:/var/www/index.html:ro
            - ./www/ccsc.html:/var/www/ccsc.html:ro
            - ./www/js:/var/www/js:ro
            - ./www/css:/var/www/css:ro
            - ./www/img:/var/www/img:ro
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/proxy-health"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 5s
    react:
        build:
            context: .
            dockerfile: react/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        volumes: 
            - ./react:/react
            - /react/node_modules
        command: "node_modules/.bin/vite"
        
volumes: 
    postgis_data:
